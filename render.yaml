services:
  - type: web
    name: carbonproof-ai-api
    runtime: node
    rootDir: apps/api
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run deploy:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: mock
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: DATABASE_URL
        sync: false
      - key: SUI_NETWORK
        value: testnet
      - key: SUI_RPC_URL
        sync: false
      - key: WALRUS_ENDPOINT
        sync: false
      - key: UPLOAD_MAX_SIZE_MB
        value: 5
